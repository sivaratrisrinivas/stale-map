[project]
name = "stale-map"
version = "0.1.0"
description = "Outside-in freshness study of a search index, using package registries as ground truth"
requires-python = ">=3.11"
dependencies = ["packaging>=24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
